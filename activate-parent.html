<!DOCTYPE html>
<html class="light" lang="en" dir="rtl">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>EduPulse | Parent Activation</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    
    <!-- Design System -->
    <link rel="stylesheet" href="shared/main.css">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
                primary: "#10b981",
            }
          },
        },
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/notifications.js"></script>
    
    <style>
        body {
            font-family: 'Sora', 'Cairo', sans-serif;
            background: #050c15;
            color: #e8f4f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 0; opacity: 0.4;
        }

        .auth-card {
            width: 100%;
            max-width: 460px;
            background: rgba(13, 31, 53, 0.7);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 32px;
            padding: 48px;
            position: relative;
            z-index: 10;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-box {
            width: 54px; height: 54px;
            background: linear-gradient(135deg, #10b981, #34d399);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            color: #fff;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            margin: 0 auto 24px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            color: #5c7a8a;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-wrapper {
            position: relative;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            transition: all 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.04);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        .input-wrapper input {
            width: 100%;
            background: none;
            border: none;
            padding: 14px 44px 14px 16px;
            color: #e8f4f0;
            font-size: 14px;
            outline: none;
        }

        .input-wrapper .material-symbols-outlined {
            position: absolute;
            right: 14px; top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: #3a5a6e;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: #10b981;
            border: none;
            border-radius: 16px;
            color: #fff;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
            margin-top: 24px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.4);
            background: #0ea573;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="logo-box">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 28px;">verified_user</span>
        </div>
        
        <div class="text-center mb-10">
            <h2 class="text-2xl font-black text-white mb-2">تفعيل حساب ولي الأمر</h2>
            <p class="text-[11px] text-[#5c7a8a] font-bold uppercase tracking-widest">Parent Portal Activation</p>
        </div>

        <form id="activationForm" class="space-y-6">
            <div class="form-group">
                <label>رقم الهوية الوطنية</label>
                <div class="input-wrapper">
                    <span class="material-symbols-outlined">badge</span>
                    <input id="nationalId" type="text" required placeholder="أدخل رقم الهوية المسجل">
                </div>
            </div>

            <div id="extraFields" class="hidden space-y-6 animate-fadeIn">
                <div class="p-4 bg-[var(--emerald-glow)] border border-[var(--emerald-border)] rounded-2xl flex items-center gap-3">
                    <span class="material-symbols-outlined text-[var(--emerald)]">check_circle</span>
                    <p class="text-[11px] font-bold text-[var(--emerald)] uppercase tracking-wider">تم العثور على بياناتك بنجاح!</p>
                </div>
                
                <div class="form-group">
                    <label>البريد الإلكتروني</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined">mail</span>
                        <input id="email" type="email" placeholder="example@mail.com">
                    </div>
                </div>

                <div class="form-group">
                    <label>كلمة المرور الجديدة</label>
                    <div class="input-wrapper">
                        <span class="material-symbols-outlined">lock</span>
                        <input id="password" type="password" placeholder="••••••••">
                    </div>
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">
                <span id="btnText">التحقق من الهوية</span>
                <span id="btnIcon" class="material-symbols-outlined">query_stats</span>
                <div id="btnSpinner" class="hidden w-5 h-5 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
            </button>
        </form>

        <div class="mt-10 text-center">
            <p class="text-xs text-[#5c7a8a]">
                لديك حساب بالفعل؟ <a href="login.html" class="text-[var(--emerald)] font-bold decoration-dotted hover:underline">تسجيل الدخول</a>
            </p>
        </div>
    </div>

    <script>
        let isVerified = false;
        const btn = document.getElementById('submitBtn');
        const btnText = document.getElementById('btnText');
        const btnIcon = document.getElementById('btnIcon');
        const btnSpinner = document.getElementById('btnSpinner');

        function setLoading(isLoading, text) {
            btn.disabled = isLoading;
            btnSpinner.classList.toggle('hidden', !isLoading);
            btnIcon.classList.toggle('hidden', isLoading);
            if (text) btnText.textContent = text;
        }

        document.getElementById('activationForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const nationalId = document.getElementById('nationalId').value;

            if (!isVerified) {
                setLoading(true, 'جاري التحقق...');

                try {
                    const { data: exists, error } = await supabase
                        .rpc('check_parent_exists', { national_id_input: nationalId });

                    if (error || !exists) {
                        Notifications.error('خطأ في التحقق', 'عذراً، رقم الهوية هذا غير مسجل لدينا.');
                    } else {
                        isVerified = true;
                        document.getElementById('nationalId').readOnly = true;
                        document.getElementById('nationalId').parentElement.style.opacity = '0.5';
                        
                        document.getElementById('email').required = true;
                        document.getElementById('password').required = true;

                        document.getElementById('extraFields').classList.remove('hidden');
                        btnIcon.textContent = 'person_add';
                        setLoading(false, 'إنشاء الحساب');
                        Notifications.success('تم التحقق', 'يرجى إكمال بيانات تسجيل الدخول.');
                    }
                } catch (err) {
                    Notifications.error('خطأ تقني', 'حدث خطأ غير متوقع.');
                } finally {
                    if (!isVerified) setLoading(false, 'تحقق من الهوية');
                }
            } else {
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;

                setLoading(true, 'جاري التفعيل...');

                const { data: authData, error: authError } = await supabase.auth.signUp({
                    email,
                    password,
                    options: {
                        data: {
                            national_id: nationalId,
                            role: 'parent',
                            full_name: 'Parent of ' + nationalId
                        }
                    }
                });

                if (authError) {
                    Notifications.error('خطأ في التسجيل', authError.message);
                    setLoading(false, 'إنشاء الحساب');
                } else {
                    Notifications.success('تم التفعيل', 'تم إنشاء حسابك بنجاح!');
                    setTimeout(() => window.location.href = 'login.html', 2000);
                }
            }
        });
    </script>
</body>
</html>
