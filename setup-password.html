<!DOCTYPE html>
<html class="light" lang="en" dir="ltr">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>EduPulse | Setup Password</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    
    <!-- Design System -->
    <link rel="stylesheet" href="shared/main.css">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
                primary: "#10b981",
            }
          },
        },
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    
    <style>
        body {
            font-family: 'Sora', sans-serif;
            background: #050c15;
            color: #e8f4f0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 0; opacity: 0.4;
        }

        .auth-card {
            width: 100%;
            max-width: 440px;
            background: rgba(13, 31, 53, 0.7);
            backdrop-filter: blur(24px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 32px;
            padding: 48px;
            position: relative;
            z-index: 10;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo-box {
            width: 54px; height: 54px;
            background: linear-gradient(135deg, #10b981, #34d399);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            color: #fff;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            margin: 0 auto 24px;
        }

        .form-group label {
            display: block;
            font-size: 11px;
            font-weight: 800;
            color: #5c7a8a;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .input-wrapper {
            position: relative;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            transition: all 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: #10b981;
            background: rgba(16, 185, 129, 0.04);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        .input-wrapper input {
            width: 100%;
            background: none;
            border: none;
            padding: 14px 16px 14px 44px;
            color: #e8f4f0;
            font-size: 14px;
            outline: none;
        }

        .input-wrapper .material-symbols-outlined {
            position: absolute;
            left: 14px; top: 50%;
            transform: translateY(-50%);
            font-size: 20px;
            color: #3a5a6e;
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: #10b981;
            border: none;
            border-radius: 16px;
            color: #fff;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
            margin-top: 24px;
            display: flex; align-items: center; justify-content: center; gap: 10px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.4);
            background: #0ea573;
        }
    </style>
</head>
<body>

    <div class="auth-card">
        <div class="logo-box">
            <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 28px;">key</span>
        </div>
        
        <div class="text-center mb-10">
            <h2 class="text-2xl font-black text-white mb-2">Setup Your Account</h2>
            <p class="text-[11px] text-[#5c7a8a] font-bold uppercase tracking-widest">Choose a secure password</p>
        </div>

        <form id="setupPasswordForm" class="space-y-6">
            <div class="form-group">
                <label>New Password</label>
                <div class="input-wrapper">
                    <span class="material-symbols-outlined">lock</span>
                    <input id="newPassword" type="password" required minlength="6" placeholder="••••••••">
                </div>
            </div>

            <div class="form-group">
                <label>Confirm Password</label>
                <div class="input-wrapper">
                    <span class="material-symbols-outlined">lock_reset</span>
                    <input id="confirmPassword" type="password" required minlength="6" placeholder="••••••••">
                </div>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">
                <span>Complete Setup</span>
                <span class="material-symbols-outlined">arrow_forward</span>
            </button>
        </form>

        <div id="statusMsg" class="mt-8 text-center text-xs font-bold uppercase tracking-widest hidden"></div>
    </div>

    <script>
        const setupForm = document.getElementById('setupPasswordForm');
        const statusMsg = document.getElementById('statusMsg');
        const submitBtn = document.getElementById('submitBtn');

        setupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const newPassword = document.getElementById('newPassword').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (newPassword !== confirmPassword) {
                showStatus('Passwords do not match!', 'text-red-500');
                return;
            }

            try {
                setLoading(true);
                
                const { error } = await supabase.auth.updateUser({
                    password: newPassword
                });

                if (error) throw error;

                showStatus('Success! Account ready. Redirecting...', 'text-[var(--emerald)]');
                
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);

            } catch (error) {
                console.error('Error:', error.message);
                showStatus('Error: ' + error.message, 'text-red-500');
                setLoading(false);
            }
        });

        function showStatus(msg, colorClass) {
            statusMsg.textContent = msg;
            statusMsg.className = `mt-8 text-center text-xs font-bold uppercase tracking-widest ${colorClass}`;
            statusMsg.classList.remove('hidden');
        }

        function setLoading(isLoading) {
            submitBtn.disabled = isLoading;
            submitBtn.querySelector('span').textContent = isLoading ? 'Setting up...' : 'Complete Setup';
        }
    </script>
</body>
</html>
