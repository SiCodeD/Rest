<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>EduPulse | Sign In</title>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    
    <!-- Scripts -->
    <script src="js/theme-init.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-config.js"></script>
    <script src="js/notifications.js"></script>
    <script src="js/db.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/i18n.js"></script>
    <script src="js/dark-mode.js"></script>

    <style>
        :root {
            --emerald: #10b981;
            --emerald-dim: #059669;
            --emerald-glow: rgba(16, 185, 129, 0.18);
            --emerald-border: rgba(16, 185, 129, 0.25);
            --bg: #050c15;
            --surface: #0a1628;
            --card: rgba(13, 31, 53, 0.7);
            --border: rgba(255,255,255,0.06);
            --border-bright: rgba(255,255,255,0.1);
            --text: #e8f4f0;
            --text-muted: #5c7a8a;
            --text-dim: #3a5a6e;
            --radius-xl: 24px;
            --radius-lg: 16px;
            --radius-md: 12px;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Sora', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
        }

        /* ─── NOISE & GLOW ─── */
        body::before {
            content: '';
            position: fixed; inset: 0;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
            pointer-events: none; z-index: 0; opacity: 0.4;
        }

        body::after {
            content: '';
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            width: 600px; height: 600px;
            background: radial-gradient(circle, rgba(16,185,129,0.08) 0%, transparent 70%);
            z-index: -1; pointer-events: none;
        }

        /* ─── LOGIN CARD ─── */
        .login-card {
            width: 100%;
            max-width: 440px;
            background: var(--card);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-bright);
            border-radius: var(--radius-xl);
            padding: 48px;
            position: relative;
            z-index: 10;
            animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .brand-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 40px;
        }

        .logo-box {
            width: 54px; height: 54px;
            background: linear-gradient(135deg, var(--emerald), #34d399);
            border-radius: 16px;
            display: flex; align-items: center; justify-content: center;
            color: #fff;
            box-shadow: 0 10px 25px rgba(16, 185, 129, 0.3);
            margin-bottom: 16px;
        }

        .brand-name {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #fff, #a7f3d0);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .brand-sub {
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-dim);
            letter-spacing: 4px;
            text-transform: uppercase;
            margin-top: 6px;
        }

        /* ─── FORM ─── */
        .form-group { margin-bottom: 24px; }
        .form-group label {
            display: block;
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 10px;
            letter-spacing: 0.3px;
        }

        .input-wrapper {
            position: relative;
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border-bright);
            border-radius: var(--radius-md);
            transition: all 0.2s;
        }

        .input-wrapper:focus-within {
            border-color: var(--emerald);
            background: rgba(16, 185, 129, 0.04);
            box-shadow: 0 0 0 4px rgba(16, 185, 129, 0.1);
        }

        .input-wrapper input {
            width: 100%;
            background: none;
            border: none;
            padding: 14px 16px 14px 44px;
            color: var(--text);
            font-family: 'Sora', sans-serif;
            font-size: 14px;
            outline: none;
        }

        .input-wrapper .material-symbols-outlined {
            position: absolute;
            left: 14px; top: 50%;
            transform: translateY(-50%);
            font-size: 18px;
            color: var(--text-dim);
            transition: color 0.2s;
        }

        .input-wrapper:focus-within .material-symbols-outlined {
            color: var(--emerald);
        }

        .btn-submit {
            width: 100%;
            padding: 16px;
            background: var(--emerald);
            border: none;
            border-radius: var(--radius-md);
            color: #fff;
            font-family: 'Sora', sans-serif;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 4px 20px rgba(16, 185, 129, 0.3);
            margin-top: 8px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(16, 185, 129, 0.4);
            background: #0ea573;
        }

        .btn-submit:active { transform: translateY(0); }

        /* ─── UTILS ─── */
        .flex-between { display: flex; align-items: center; justify-content: space-between; }
        .forgot-link { font-size: 12px; color: var(--emerald); text-decoration: none; font-weight: 600; }
        .forgot-link:hover { text-decoration: underline; }

        .activate-box {
            margin-top: 32px;
            padding: 20px;
            background: rgba(16, 185, 129, 0.05);
            border: 1px dashed var(--emerald-border);
            border-radius: var(--radius-lg);
            text-align: center;
        }

        .activate-box p { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
        .btn-outline {
            display: inline-block;
            padding: 8px 16px;
            border: 1px solid var(--emerald-border);
            border-radius: 8px;
            color: var(--emerald);
            text-decoration: none;
            font-size: 12px;
            font-weight: 700;
            transition: all 0.2s;
        }
        .btn-outline:hover { background: rgba(16,185,129,0.1); border-color: var(--emerald); }

        .demo-access {
            margin-top: 40px;
            padding-top: 24px;
            border-top: 1px solid var(--border);
        }

        .demo-title {
            font-size: 10px;
            font-family: 'JetBrains Mono', monospace;
            color: var(--text-dim);
            text-align: center;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .demo-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
        }

        .demo-btn {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 10px 4px;
            color: var(--text-muted);
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .demo-btn:hover {
            background: rgba(16, 185, 129, 0.08);
            border-color: var(--emerald-border);
            color: var(--emerald);
            transform: translateY(-2px);
        }

        .demo-btn span { font-size: 16px; }
        .demo-btn label { font-size: 8px; font-weight: 700; cursor: pointer; }

        .lang-toggle {
            position: absolute;
            top: 24px; right: 24px;
            background: none;
            border: 1px solid var(--border);
            padding: 6px 12px;
            border-radius: 20px;
            color: var(--text-muted);
            font-size: 11px;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
        }

        .lang-toggle:hover { border-color: var(--emerald-border); color: var(--emerald); }

        [dir="rtl"] .brand-sub { letter-spacing: 0; }
        [dir="rtl"] .input-wrapper input { padding: 14px 44px 14px 16px; }
        [dir="rtl"] .input-wrapper .material-symbols-outlined { left: auto; right: 14px; }
    </style>
</head>
<body>

    <button onclick="I18N.toggleLanguage()" class="lang-toggle">
        <span class="material-symbols-outlined" style="font-size: 14px;">language</span>
        <span id="langSwitchLabel">العربية</span>
    </button>

    <div class="login-card">
        <div class="brand-header">
            <div class="logo-box">
                <span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 28px;">school</span>
            </div>
            <h1 class="brand-name">EduPulse</h1>
            <div class="brand-sub">Modern Management</div>
        </div>

        <form id="loginForm">
            <div class="form-group">
                <label data-i18n="email_address">Email Address</label>
                <div class="input-wrapper">
                    <span class="material-symbols-outlined">mail</span>
                    <input type="email" id="email" placeholder="admin@school.com" required>
                </div>
            </div>

            <div class="form-group">
                <div class="flex-between" style="margin-bottom: 10px;">
                    <label style="margin-bottom: 0;" data-i18n="password">Password</label>
                    <a href="#" class="forgot-link" data-i18n="forgot_password">Forgot?</a>
                </div>
                <div class="input-wrapper">
                    <span class="material-symbols-outlined">lock</span>
                    <input type="password" id="password" placeholder="••••••••" required>
                </div>
            </div>

            <button type="submit" class="btn-submit" data-i18n="sign_in">Sign In</button>

            <div class="activate-box">
                <p>New Parent? Activate your account now.</p>
                <a href="activate-parent.html" class="btn-outline">Activate Account</a>
            </div>
        </form>

        <div class="demo-access">
            <div class="demo-title">Quick Demo</div>
            <div class="demo-grid">
                <button onclick="demoLogin('a@a.ca')" class="demo-btn">
                    <span class="material-symbols-outlined">hub</span>
                    <label>Platform</label>
                </button>
                <button onclick="demoLogin('admin@test.com')" class="demo-btn">
                    <span class="material-symbols-outlined">admin_panel_settings</span>
                    <label>Admin</label>
                </button>
                <button onclick="demoLogin('te@test.com')" class="demo-btn">
                    <span class="material-symbols-outlined">history_edu</span>
                    <label>Teacher</label>
                </button>
                <button onclick="demoLogin('se@test.com')" class="demo-btn">
                    <span class="material-symbols-outlined">badge</span>
                    <label>Secretary</label>
                </button>
                <button onclick="demoLogin('smarting2002@gmail.com')" class="demo-btn">
                    <span class="material-symbols-outlined">family_restroom</span>
                    <label>Parent</label>
                </button>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.textContent;
            btn.disabled = true;
            btn.textContent = '...';

            const result = await Auth.login(email, password);
            
            if (result.success) {
                Auth.redirectByRole(result.user);
            } else {
                btn.disabled = false;
                btn.textContent = originalText;
                alert(result.message || 'Error occurred');
            }
        });

        function demoLogin(email) {
            document.getElementById('email').value = email;
            document.getElementById('password').value = '123456';
            document.getElementById('loginForm').dispatchEvent(new Event('submit'));
        }
    </script>
</body>
</html>
