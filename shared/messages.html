<!DOCTYPE html>
<html class="light" lang="en" dir="ltr">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>EduPulse | Messages</title>
    <script src="../js/theme-init.js"></script>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&family=Sora:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
    <link rel="stylesheet" href="../shared/main.css">
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
                primary: "#10b981",
            }
          },
        },
      }
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/notifications.js"></script>
    <script src="../js/db.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/i18n.js"></script>
    <script src="../js/dark-mode.js"></script>
    <script src="../js/dashboard.js"></script>
    <script src="../js/navigation.js"></script>
    <script src="../js/messages.js" defer></script>
</head>
<body data-allowed-roles="admin,teacher,secretary,parent">
    <aside data-role-sidebar></aside>

    <main style="padding-bottom: 0;">
        <header class="main-header">
            <div>
                <h2 data-i18n="messages">Messages</h2>
                <p>Connect with your school community.</p>
            </div>
            <div class="flex items-center gap-6">
                <div class="header-badge">
                    <div class="dot"></div>
                    <span id="unreadCountBadge">0 New Messages</span>
                </div>
                <div class="h-8 w-[1px] bg-[var(--border)]"></div>
                <div class="flex items-center gap-4">
                    <div class="text-right">
                        <p class="text-xs font-bold user-name">Loading...</p>
                        <p class="text-[10px] text-[var(--text-muted)] font-semibold uppercase tracking-wider user-role">Role</p>
                    </div>
                    <div class="avatar bg-[var(--emerald)] text-white user-initials">??</div>
                    <button id="logoutBtn" class="icon-btn hover:text-red-500">
                        <span class="material-symbols-outlined">logout</span>
                    </button>
                </div>
            </div>
        </header>

        <div class="page-section" style="height: calc(100vh - var(--header-h) - 32px); margin-top: 0;">
            <div class="table-card h-full flex overflow-hidden">
                <!-- Inbox Sidebar -->
                <div class="w-80 border-r border-[var(--border)] flex flex-col bg-white/2">
                    <div class="p-6 border-b border-[var(--border)]">
                        <button id="composeMessageBtn" class="btn-primary w-full justify-center">
                            <span class="material-symbols-outlined text-lg">edit_square</span>
                            <span>New Message</span>
                        </button>
                    </div>
                    <div id="messageInboxList" class="flex-1 overflow-y-auto custom-scrollbar">
                        <!-- Messages loaded via JS -->
                    </div>
                </div>

                <!-- Chat Area -->
                <div class="flex-1 flex flex-col bg-white/2">
                    <div id="conversationPlaceholder" class="flex-1 flex flex-col items-center justify-center p-8 text-center opacity-40">
                        <div class="w-20 h-20 rounded-2xl bg-[var(--emerald-glow)] text-[var(--emerald)] flex items-center justify-center mb-6">
                            <span class="material-symbols-outlined text-4xl">chat_bubble</span>
                        </div>
                        <h3 class="title-md">Your Conversations</h3>
                        <p class="text-muted mt-2 max-w-xs mx-auto text-sm">Select a chat from the sidebar to start messaging.</p>
                    </div>

                    <div id="conversationPanel" class="hidden flex-1 flex flex-col h-full overflow-hidden">
                        <div class="px-8 py-5 border-b border-[var(--border)] flex justify-between items-center bg-white/2">
                            <div>
                                <h3 id="conversationTitle" class="title-md">Conversation</h3>
                                <div class="flex items-center gap-2 mt-1">
                                    <div class="w-2 h-2 rounded-full bg-emerald-500"></div>
                                    <p id="conversationSubtitle" class="text-[10px] text-[var(--text-muted)] font-bold uppercase tracking-widest">Active now</p>
                                </div>
                            </div>
                            <div class="flex gap-2">
                                <button class="icon-btn">
                                    <span class="material-symbols-outlined">info</span>
                                </button>
                            </div>
                        </div>
                        
                        <div id="conversationMessages" class="flex-1 overflow-y-auto p-8 space-y-6 custom-scrollbar bg-black/10">
                            <!-- Messages will appear here -->
                        </div>

                        <form id="messageReplyForm" class="p-6 border-t border-[var(--border)] bg-white/2 flex gap-4 items-end">
                            <div class="flex-1 bg-white/5 border border-[var(--border)] rounded-2xl p-1.5 focus-within:border-[var(--emerald-border)] transition-all">
                                <textarea id="replyMessageInput" class="w-full bg-transparent border-none focus:ring-0 text-sm p-3 resize-none min-h-[44px] max-h-32" placeholder="Type your message..." required rows="1"></textarea>
                            </div>
                            <button type="submit" class="btn-primary p-3 rounded-2xl">
                                <span class="material-symbols-outlined">send</span>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Compose Modal -->
    <div id="composeMessageModal" class="modal-backdrop">
        <div class="modal-box">
            <div class="modal-header">
                <div>
                    <h3>New Message</h3>
                    <p class="text-muted text-xs mt-1">Start a new conversation</p>
                </div>
                <button id="closeComposeModal" class="modal-close">
                    <span class="material-symbols-outlined">close</span>
                </button>
            </div>
            <form id="composeMessageForm" class="space-y-5">
                <div class="form-group">
                    <label>Recipient</label>
                    <select id="messageRecipient" required>
                        <!-- Recipient options loaded via JS -->
                    </select>
                </div>
                <div class="form-group">
                    <label>Message Content</label>
                    <textarea id="composeMessageInput" rows="5" placeholder="Write your message here..." required></textarea>
                </div>
                <div class="flex gap-3 pt-4">
                    <button type="button" id="closeComposeModalBtn" class="btn-secondary flex-1 justify-center">Cancel</button>
                    <button type="submit" class="btn-primary flex-1 justify-center">
                        <span>Send Message</span>
                        <span class="material-symbols-outlined text-sm">send</span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
