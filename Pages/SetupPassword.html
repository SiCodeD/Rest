<!doctype html>
<html class="light" lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>مرسالك | Mersalak | إعداد كلمة المرور</title>

    <!-- Fonts -->
    <link rel="stylesheet" href="../css/local-fonts.css" />

    <!-- Design System -->
    <link rel="stylesheet" href="../css/tailwind.css" />
    <link rel="stylesheet" href="../css/edupulse.css" />
    <link rel="stylesheet" href="../css/pages/auth.css" />
    <script>
      window.tailwind = window.tailwind || {};
      window.tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              primary: "#10b981",
            },
          },
        },
      };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase-config.js"></script>
    <script src="../js/auth.js"></script>
  </head>
  <body>
    <div class="auth-card">
      <div class="logo-box">
        <span
          class="material-symbols-outlined"
          style="font-variation-settings: &quot;FILL&quot; 1; font-size: 28px"
          >key</span
        >
      </div>

      <div class="text-center mb-10">
        <h2 class="text-2xl font-black text-white mb-2">Setup Your Account</h2>
        <p
          class="text-[11px] text-[#5c7a8a] font-bold uppercase tracking-widest"
        >
          Choose a secure password
        </p>
      </div>

      <form id="setupPasswordForm" class="space-y-6">
        <div class="form-group">
          <label>New Password</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined">lock</span>
            <input
              id="newPassword"
              type="password"
              required
              minlength="6"
              placeholder="••••••••"
            />
          </div>
        </div>

        <div class="form-group">
          <label>Confirm Password</label>
          <div class="input-wrapper">
            <span class="material-symbols-outlined">lock_reset</span>
            <input
              id="confirmPassword"
              type="password"
              required
              minlength="6"
              placeholder="••••••••"
            />
          </div>
        </div>

        <button type="submit" id="submitBtn" class="btn-submit">
          <span>Complete Setup</span>
          <span class="material-symbols-outlined">arrow_forward</span>
        </button>
      </form>

      <div
        id="statusMsg"
        class="mt-8 text-center text-xs font-bold uppercase tracking-widest hidden"
      ></div>
    </div>

    <script>
      const setupForm = document.getElementById("setupPasswordForm");
      const statusMsg = document.getElementById("statusMsg");
      const submitBtn = document.getElementById("submitBtn");

      setupForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const newPassword = document.getElementById("newPassword").value;
        const confirmPassword =
          document.getElementById("confirmPassword").value;

        if (newPassword !== confirmPassword) {
          showStatus("Passwords do not match!", "text-red-500");
          return;
        }

        try {
          setLoading(true);

          const { error } = await supabase.auth.updateUser({
            password: newPassword,
          });

          if (error) throw error;

          showStatus(
            "تم إنشاء كلمة المرور! جاري التوجيه...",
            "text-[var(--emerald)]",
          );

          // Get user role and redirect accordingly
          setTimeout(async () => {
            try {
              const {
                data: { user },
              } = await supabase.auth.getUser();
              window.location.href =
                user?.user_metadata?.role === "super-admin"
                  ? "SuperAdminDashboard.html"
                  : "AdminDashboard.html";
            } catch (err) {
              window.location.href = "Login.html";
            }
          }, 2000);
        } catch (error) {
          console.error("Error:", error.message);
          showStatus("Error: " + error.message, "text-red-500");
          setLoading(false);
        }
      });

      function showStatus(msg, colorClass) {
        statusMsg.textContent = msg;
        statusMsg.className = `mt-8 text-center text-xs font-bold uppercase tracking-widest ${colorClass}`;
        statusMsg.classList.remove("hidden");
      }

      function setLoading(isLoading) {
        submitBtn.disabled = isLoading;
        submitBtn.querySelector("span").textContent = isLoading
          ? "Setting up..."
          : "Complete Setup";
      }
    </script>
  </body>
</html>
